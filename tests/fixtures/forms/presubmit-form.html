<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-submit check test form</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1d1d1f; background: #fff; }
  label { display: block; font-weight: 600; margin: 8px 0 2px; } input, select, textarea { padding: 6px; min-width: 300px; }
  fieldset { border: 1px solid #ddd; margin: 12px 0; padding: 8px 12px; }
</style>
</head>
<body>
<h1>Product Manager application</h1>
<!-- Pre-filled by the site from a parsed resume, with mistakes: Xaigi start month (July, resume: Jun 2024), Nu10 end year (2025, resume: Jul 2026), college (IIT Bombay), LinkedIn (a GitHub link). -->
<form id="app" onsubmit="return false">
  <label for="first_name">First name *</label><input id="first_name" type="text" required>
  <label for="last_name">Last name *</label><input id="last_name" type="text" required>
  <label for="email">Email *</label><input id="email" type="email" required>
  <h2>Work experience</h2>
  <fieldset class="employment"><legend>Employment 1</legend>
    <label for="company-name-0">Company name *</label><input id="company-name-0" type="text" required>
    <label for="title-0">Title *</label><input id="title-0" type="text" required>
    <label for="start-date-month-0">Start date month *</label><select id="start-date-month-0" required><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="start-date-year-0">Start date year *</label><input id="start-date-year-0" type="text" required>
    <label for="end-date-month-0">End date month</label><select id="end-date-month-0"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="end-date-year-0">End date year</label><input id="end-date-year-0" type="text" value="2025">
  </fieldset>
  <fieldset class="employment"><legend>Employment 2</legend>
    <label for="company-name-1">Company name *</label><input id="company-name-1" type="text" required>
    <label for="title-1">Title *</label><input id="title-1" type="text" required>
    <label for="start-date-month-1">Start date month *</label><select id="start-date-month-1" required><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="start-date-year-1">Start date year *</label><input id="start-date-year-1" type="text" required>
    <label for="end-date-month-1">End date month</label><select id="end-date-month-1"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="end-date-year-1">End date year</label><input id="end-date-year-1" type="text">
  </fieldset>
  <fieldset class="employment"><legend>Employment 3</legend>
    <label for="company-name-2">Company name *</label><input id="company-name-2" type="text" required>
    <label for="title-2">Title *</label><input id="title-2" type="text" required>
    <label for="start-date-month-2">Start date month *</label><select id="start-date-month-2" required><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option selected>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="start-date-year-2">Start date year *</label><input id="start-date-year-2" type="text" required>
    <label for="end-date-month-2">End date month</label><select id="end-date-month-2"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="end-date-year-2">End date year</label><input id="end-date-year-2" type="text">
  </fieldset>
  <fieldset class="employment"><legend>Employment 4</legend>
    <label for="company-name-3">Company name *</label><input id="company-name-3" type="text" required>
    <label for="title-3">Title *</label><input id="title-3" type="text" required>
    <label for="start-date-month-3">Start date month *</label><select id="start-date-month-3" required><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="start-date-year-3">Start date year *</label><input id="start-date-year-3" type="text" required>
    <label for="end-date-month-3">End date month</label><select id="end-date-month-3"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="end-date-year-3">End date year</label><input id="end-date-year-3" type="text">
  </fieldset>
  <fieldset class="employment"><legend>Employment 5</legend>
    <label for="company-name-4">Company name *</label><input id="company-name-4" type="text" required>
    <label for="title-4">Title *</label><input id="title-4" type="text" required>
    <label for="start-date-month-4">Start date month *</label><select id="start-date-month-4" required><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="start-date-year-4">Start date year *</label><input id="start-date-year-4" type="text" required>
    <label for="end-date-month-4">End date month</label><select id="end-date-month-4"><option value="">Select</option><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select>
    <label for="end-date-year-4">End date year</label><input id="end-date-year-4" type="text">
  </fieldset>
  <h2>Education</h2>
  <label for="school">School *</label><select id="school" required><option value="">Select</option><option selected>IIT Bombay</option><option>Indian Institute of Technology Guwahati</option><option>Delhi University</option></select>
  <label for="degree">Degree *</label><select id="degree" required><option value="">Select</option><option>Bachelor of Technology</option><option>Master of Business Administration</option></select>
  <label for="grad">Graduation year *</label><input id="grad" type="text" required>
  <h2>Links</h2>
  <label for="linkedin">LinkedIn profile</label><input id="linkedin" type="url" value="https://github.com/ymahee363">
  <label for="website">Website</label><input id="website" type="url">
  <label for="cover">Cover letter *</label><textarea id="cover" rows="5" required></textarea>
  <button type="button" id="submit">Submit application</button>
</form>
<script>
(function () {
  window.__submitted = null;
  document.getElementById("submit").addEventListener("click", function () {
    var data = {};
    document.querySelectorAll("#app input, #app select, #app textarea").forEach(function (el) { data[el.id] = el.value; });
    window.__submitted = data;
    document.getElementById("app").outerHTML = "<h2>Thank you for applying! Your application has been submitted.</h2>";
  });
})();
</script>
</body>
</html>
